# Production (Render + Neon). Every value comes from the environment, with no defaults,
# so a missing variable fails at startup instead of silently using a dev value.
server.port=${PORT:8080}

# e.g. jdbc:postgresql://<host>.neon.tech/restaurant?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Free tiers: little RAM, limited database connections
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

management.endpoint.health.show-details=never
