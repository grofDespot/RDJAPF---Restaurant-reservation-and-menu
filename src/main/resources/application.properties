spring.application.name=restaurant

# Default profile = local development against the PostgreSQL from docker-compose.yml.
# These credentials only work for that local container. Production values come from
# environment variables in application-prod.properties and are never committed.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/restaurant}
spring.datasource.username=${DB_USERNAME:restaurant}
spring.datasource.password=${DB_PASSWORD:restaurant}

# Small, explicit pool: one restaurant, short transactions (justified in a later ADR)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000

# Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
# No lazy loading from templates: each use case fetches what it needs
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
